services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homeopath_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/homeopath_dev
      RUN_MIGRATIONS: "true"
      OTP_PROVIDER: console
      SMS_PROVIDER: console
      JWT_SECRET_KEY: local-dev-secret
      TOKEN_HASH_PEPPER: local-dev-pepper
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/homeopath_dev
      OTP_PROVIDER: console
      SMS_PROVIDER: console
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: