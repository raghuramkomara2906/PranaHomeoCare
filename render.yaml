databases:
  - name: homeopath-db
    plan: free
    postgresMajorVersion: "16"

services:
  # ── FastAPI API + embedded SMS worker (one Starter service) ──────────────
  - type: web
    name: homeopath-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: singapore
    healthCheckPath: /api/v1/health
    preDeployCommand: "alembic upgrade head && python -m app.seed"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homeopath-db
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "false"
      - key: EMBEDDED_WORKER
        value: "true"
      - key: OTP_PROVIDER
        value: twofactor
      - key: TWOFACTOR_API_KEY
        sync: false
      - key: TWOFACTOR_OTP_TEMPLATE
        value: ""
      - key: SMS_PROVIDER
        value: console
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TOKEN_HASH_PEPPER
        generateValue: true
      - key: MEETING_ENCRYPTION_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://pranahomeocare.com
      - key: SEED_ADMIN_EMAIL
        value: doctor@pranahomeocare.com
      - key: SEED_ADMIN_PASSWORD
        sync: false

# ── Next.js frontend (Free tier) ─────────────────────────────────────────
  - type: web
    name: homeopath-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://homeopath-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://pranahomeocare.com