services:
  - type: web
    name: homeopath-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: singapore
    healthCheckPath: /api/v1/health
    preDeployCommand: "sh deploy.sh"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RUN_MIGRATIONS
        value: "false"
      - key: EMBEDDED_WORKER
        value: "true"
      - key: OTP_PROVIDER
        value: twofactor
      - key: TWOFACTOR_API_KEY
        sync: false
      - key: TWOFACTOR_OTP_TEMPLATE
        value: ""
      - key: SMS_PROVIDER
        value: console
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: TOKEN_HASH_PEPPER
        generateValue: true
      - key: MEETING_ENCRYPTION_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://pranahomeocare.com
      - key: SEED_ADMIN_EMAIL
        value: doctor@pranahomeocare.com
      - key: SEED_ADMIN_PASSWORD
        sync: false